# Dokploy production stack: the @quran/web SSR app.
#
# Postgres is NOT in this compose — it runs as a native Dokploy Database
# ("quran-db", postgresId B9bhitW0jh52aF8fJOnOj) so it has its own backups,
# external-access toggle, and lifecycle independent of app redeploys. The app
# reaches it over dokploy-network by the DB's service name; DATABASE_URL is set
# in the Dokploy Environment.
#
# Deployed as a Dokploy "Compose" service (Git source: hkashlan/quran-companion,
# composePath: infra/dokploy/docker-compose.yml). Dokploy substitutes the
# ${...} values from the service Environment and attaches the web container to
# Traefik via the domains configured in the Dokploy UI/API.
#
# Two domains point at service `web` (both with a letsencrypt cert, so each has
# valid TLS): quran-companion.de and www.quran-companion.de. The apex is the
# canonical host — the app itself 301/308s www → apex (apps/web/src/server.ts)
# so sessions aren't split across two origins. BETTER_AUTH_URL must be the apex.
#
# Build-time note: VITE_BETTER_AUTH_URL is baked into the client bundle, so it
# is passed as a build arg (not only runtime env).

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_BETTER_AUTH_URL: ${VITE_BETTER_AUTH_URL}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Set in the Dokploy Environment; points at the native quran-db database
      # over dokploy-network (postgresql://quran:<pw>@<db-appName>:5432/quran).
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      VITE_BETTER_AUTH_URL: ${VITE_BETTER_AUTH_URL}
      CRON_SECRET: ${CRON_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FIREBASE_WEB_CONFIG: ${FIREBASE_WEB_CONFIG}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY}
    networks:
      - dokploy-network
    expose:
      - "3000"

networks:
  # Shared network Traefik and the native quran-db database both live on.
  dokploy-network:
    external: true
