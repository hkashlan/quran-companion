<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a7b4f" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>رفيق القرآن</title>
		<style>
			html, body { margin: 0; height: 100%; background: #fafbf9; font-family: system-ui, sans-serif; }
			.wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #1a2e1a; }
			.logo { width: 88px; height: 88px; border-radius: 22px; background: #0a7b4f; display: flex; align-items: center; justify-content: center; }
			h1 { color: #0a7b4f; font-size: 24px; margin: 0; }
			p { color: #5a6e5a; font-size: 14px; max-width: 280px; text-align: center; }
		</style>
	</head>
	<body>
		<!--
			This shell is shown only when CAPACITOR_SERVER_URL is NOT set (bundled
			fallback). In production the native shell loads the deployed PWA directly
			via server.url (see capacitor.config.ts). Capgo OTA replaces this bundle.
		-->
		<div class="wrap">
			<div class="logo">
				<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
					<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
					<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
				</svg>
			</div>
			<h1>رفيق القرآن</h1>
			<p>جارٍ الاتصال بالخادم… إذا استمرت هذه الشاشة، يُرجى ضبط رابط الخادم.</p>
		</div>
	</body>
</html>
